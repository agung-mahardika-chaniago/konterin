name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Disposable PostgreSQL service shared by the backend, E2E, and restore jobs.
  TEST_DB_DSN: postgres://postgres:postgres@127.0.0.1:55432/fixphone_test?sslmode=disable
  GOFLAGS: -mod=readonly

jobs:
  backend:
    name: Backend build, vet & tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

  frontend:
    name: Frontend typecheck, unit tests & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install scanners
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: gosec
        working-directory: backend
        run: "$(go env GOPATH)/bin/gosec -quiet ./..."

      - name: govulncheck
        working-directory: backend
        run: "$(go env GOPATH)/bin/govulncheck ./..."

      - name: npm audit (production dependencies, fail on high/critical)
        working-directory: frontend
        run: npm ci && npm audit --omit=dev --audit-level=high

  restore-drill:
    name: Backup restore drill
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_DSN: postgres://postgres:postgres@127.0.0.1:55432/fixphone_test?sslmode=disable
      PGPASSWORD: postgres
      SEED_SUPERADMIN_EMAIL: superadmin@fixphone.local
      SEED_SUPERADMIN_PASSWORD: Superadmin#12345
      SEED_SUPERADMIN_NAME: Super Admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install PostgreSQL client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client-16

      - name: Prepare schema and demo tenant
        working-directory: backend
        run: |
          go run ./cmd/cli db-create
          go run ./cmd/cli migrate up
          go run ./cmd/cli seed
          go run ./cmd/cli create-tenant \
            --name "Toko Restore Drill" \
            --slug "restore-drill" \
            --owner-name "Owner Drill" \
            --owner-email "owner@restore.test" \
            --owner-password "Rahasia123" \
            --outlet-name "Outlet Drill" \
            --outlet-code "MAIN"

      - name: Run restore drill
        run: pwsh -NoProfile -File scripts/restore-drill.ps1 -SourceDSN "$env:DB_DSN"

  images:
    name: Container images & vulnerability scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/backend.Dockerfile
          load: true
          push: false
          tags: fixphone-backend:ci
          build-args: |
            VERSION=1.0.0-ci
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/frontend.Dockerfile
          load: true
          push: false
          tags: fixphone-frontend:ci

      - name: Build backup image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/backup
          load: true
          push: false
          tags: fixphone-backup:ci

      - name: Scan backend image (CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fixphone-backend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image (CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fixphone-frontend:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan backup image (CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: fixphone-backup:ci
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  deploy-smoke:
    name: Production stack smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare production environment
        run: |
          cat > .env.production <<'EOF'
          APP_ENV=production
          APP_BASE_URL=https://localhost
          APP_DOMAIN=localhost
          ACME_EMAIL=ci@fixphone.test
          TZ=UTC
          LOG_LEVEL=info
          CORS_ORIGINS=https://localhost
          TRUSTED_PROXIES=172.16.0.0/12
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-postgres-password
          POSTGRES_DB=fixphone
          DB_ADMIN_DSN=postgres://postgres:ci-postgres-password@db:5432/fixphone?sslmode=disable
          APP_DB_PASSWORD=ci-app-password-1234567890
          DB_DSN=postgres://fixphone_app:ci-app-password-1234567890@db:5432/fixphone?sslmode=disable
          JWT_SECRET=ci-only-jwt-secret-at-least-thirty-two-characters
          APP_ENC_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          ACCESS_TOKEN_TTL=15m
          REFRESH_TOKEN_TTL=720h
          SEED_SUPERADMIN_NAME=Super Admin
          SEED_SUPERADMIN_EMAIL=superadmin@fixphone.test
          SEED_SUPERADMIN_PASSWORD=CiSuperadmin12345
          SEED_DEMO=false
          METRICS_TOKEN=
          BACKUP_RETENTION_DAYS=2
          BACKUP_SCHEDULE="15 2 * * *"
          RESTORE_DRILL_SCHEDULE="15 3 * * 0"
          FIXPHONE_VERSION=1.0.0-ci
          EOF

      - name: Build and start the production stack
        run: docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build

      - name: Wait for HTTPS edge
        run: |
          for i in $(seq 1 90); do
            if curl -kfsS --max-time 5 https://localhost/healthz > /dev/null; then
              echo "edge siap setelah ${i} percobaan"
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.production -f docker-compose.prod.yml ps
          docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=120
          exit 1

      - name: Create smoke-test tenant
        run: |
          docker compose --env-file .env.production -f docker-compose.prod.yml exec -T api \
            fixphone-cli create-tenant \
            --name "Toko Smoke" \
            --slug "toko-smoke" \
            --owner-name "Owner Smoke" \
            --owner-email "owner@fixphone.test" \
            --owner-password "SmokeOwner12345" \
            --outlet-name "Outlet Smoke" \
            --outlet-code "MAIN"

      - name: Run production smoke test
        env:
          SMOKE_BASE_URL: https://localhost
          SMOKE_EMAIL: owner@fixphone.test
          SMOKE_PASSWORD: SmokeOwner12345
          SMOKE_INSECURE: "1"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends jq
          ./scripts/smoke-prod.sh

      - name: OWASP ZAP baseline (advisory)
        continue-on-error: true
        run: |
          mkdir -p zap-report
          docker run --rm --network fixphone-edge \
            -v "$PWD/zap-report:/zap/wrk:rw" \
            ghcr.io/zaproxy/zap-stable \
            zap-baseline.py -t http://web:8080 -r zap-report.html -I || true

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-report
          path: zap-report
          if-no-files-found: ignore

      - name: Container logs
        if: failure()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml logs --tail=200

      - name: Stop stack
        if: always()
        run: docker compose --env-file .env.production -f docker-compose.prod.yml down -v --remove-orphans

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DB_DSN: postgres://postgres:postgres@127.0.0.1:55432/fixphone_e2e?sslmode=disable
      APP_ENV: development
      APP_PORT: "8080"
      APP_BASE_URL: http://127.0.0.1:5173
      LOG_LEVEL: warn
      JWT_SECRET: ci-only-jwt-secret-at-least-thirty-two-characters
      APP_ENC_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      UPLOAD_DIR: uploads
      SEED_SUPERADMIN_EMAIL: superadmin@fixphone.local
      SEED_SUPERADMIN_PASSWORD: Superadmin#12345
      SEED_SUPERADMIN_NAME: Super Admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Prepare database and owner account
        working-directory: backend
        run: |
          go run ./cmd/cli db-create
          go run ./cmd/cli migrate up
          go run ./cmd/cli seed
          go run ./cmd/cli create-tenant \
            --name "Toko E2E" \
            --slug "toko-e2e" \
            --owner-name "Owner E2E" \
            --owner-email "owner@fixphone.local" \
            --owner-password "Owner#12345" \
            --outlet-name "Outlet Utama" \
            --outlet-code "MAIN"

      - name: Start API
        working-directory: backend
        run: |
          go build -o /tmp/fixphone-api ./cmd/api
          nohup /tmp/fixphone-api > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Start frontend
        working-directory: frontend
        run: |
          nohup npm run dev -- --host 127.0.0.1 --port 5173 > /tmp/web.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/web.log
          exit 1

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run E2E
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
          E2E_API_URL: http://127.0.0.1:8080/api/v1
          E2E_EMAIL: owner@fixphone.local
          E2E_PASSWORD: Owner#12345
        run: npm run e2e

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          if-no-files-found: ignore
