        Patch sebagian — hanya field yang dikirim yang diubah. Field nullable
        yang dikirim berupa string kosong akan dikosongkan dari database.
      properties:
        store_name:
          type: [string, 'null']
          maxLength: 150
          description: Tidak boleh kosong atau spasi saja.
        legal_name:
          type: [string, 'null']
          maxLength: 150
        address:
          type: [string, 'null']
        phone:
          type: [string, 'null']
          maxLength: 30
