              schema:
                $ref: '#/components/schemas/InvoiceDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'

  /invoices/{id}/print:
    get:
      tags: [Invoices]
      summary: Data cetak invoice A4/struk
      description: Memerlukan permission `invoice.view`.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Payload cetak berisi detail invoice dan header toko.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoicePrintEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

