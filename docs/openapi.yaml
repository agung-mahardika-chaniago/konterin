            - waiting_part
            - in_progress
            - testing
            - completed
            - ready_for_pickup
            - picked_up
            - cancelled
        notes:
          type: [string, 'null']
          maxLength: 1000
        cancel_reason:
          type: [string, 'null']
          maxLength: 1000

    AssignTechnicianRequest:
      type: object
      additionalProperties: false
      properties:
        technician_id:
          type: [string, 'null']
          format: uuid
        priority:
          type: string
          enum: [normal, express]

    UpsertDiagnosticRequest:
      type: object
      additionalProperties: false
      properties:
        diagnosis:
          type: [string, 'null']
          maxLength: 2000
        findings:
          type: [string, 'null']
          maxLength: 2000
        action_taken:
          type: [string, 'null']
          maxLength: 2000
        test_result:
          type: [string, 'null']
          maxLength: 2000
        technician_notes:
          type: [string, 'null']
          maxLength: 2000
        estimated_done_at:
          type: [string, 'null']
          format: date-time

