              schema:
                $ref: '#/components/schemas/ProfitReportEnvelope'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'

  /reports/expenses:
    get:
      tags: [Reports]
      summary: Laporan pengeluaran
      description: |
        Memerlukan permission `report.profit.view`. Pengeluaran diagregasi
        per kategori pada rentang, hanya pengeluaran berstatus `posted`.
      parameters:
        - $ref: '#/components/parameters/ReportOutletId'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: |
            Baris kategori dan total. Dengan `format=xlsx` respons berupa
            file Excel bernama `laporan-pengeluaran-<from>_<to>.xlsx`.
          headers:
            Content-Disposition:
              description: Hanya ada pada respons xlsx.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpensesReportEnvelope'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'

  /reports/technicians:
    get:
      tags: [Reports]
      summary: Laporan produktivitas teknisi
      description: |
        Memerlukan permission `report.view`. Per teknisi pada rentang:
        order yang ditugaskan, selesai, aktif, rata-rata jam reparasi,
        dan kontribusi pendapatan.
      parameters:
        - $ref: '#/components/parameters/ReportOutletId'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: |
            Baris teknisi. Dengan `format=xlsx` respons berupa file Excel
            bernama `laporan-teknisi-<from>_<to>.xlsx`.
          headers:
            Content-Disposition:
              description: Hanya ada pada respons xlsx.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechniciansReportEnvelope'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'

  /reports/stock:
    get:
      tags: [Reports]
      summary: Laporan stok sparepart
      description: |
        Memerlukan permission `report.view`. Snapshot stok saat ini per
        sparepart beserta nilai (harga modal) dan penanda stok rendah;
        `from`/`to` tetap divalidasi tapi tidak mengubah isi snapshot.
      parameters:
        - $ref: '#/components/parameters/ReportOutletId'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: |
            Baris sparepart dan ringkasan. Dengan `format=xlsx` respons
            berupa file Excel bernama `laporan-stok.xlsx`.
          headers:
            Content-Disposition:
              description: Hanya ada pada respons xlsx.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockReportEnvelope'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'

  /reports/inventory-valuation:
    get:
      tags: [Reports]
      summary: Valuasi inventori
      description: |
        Memerlukan permission `report.profit.view`. Cermin laporan stok
        (JSON saja, tanpa ekspor xlsx); nilai total memakai harga modal.
      parameters:
        - $ref: '#/components/parameters/ReportOutletId'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
      responses:
        '200':
          description: Baris sparepart dan ringkasan valuasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StockReportEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'

  /settings:
    get:
      tags: [Settings]
      summary: Pengaturan bisnis toko
      description: |
        Memerlukan permission `settings.view` dan hanya tersedia untuk
        pengguna tenant. Pengaturan bersifat tenant-level (baris outlet NULL).
      responses:
        '200':
          description: Pengaturan saat ini.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Settings]
      summary: Ubah sebagian pengaturan bisnis
      description: |
        Memerlukan permission `settings.manage`. Hanya field yang dikirim
        yang diubah; field nullable yang dikirim string kosong akan
        dikosongkan. Setiap perubahan tercatat di audit log sebagai
        `settings_update`, dan nilai baru langsung dipakai oleh proses
        berikutnya (mis. nama toko pada invoice).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSettingsRequest'
      responses:
        '200':
          description: Pengaturan setelah perubahan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'

  /settings/backups:
    get:
      tags: [Settings]
      summary: Riwayat backup manual
      description: |
        Memerlukan permission `settings.manage`. Maksimal 50 backup terbaru
        milik tenant, terbaru dulu.
      responses:
        '200':
          description: Daftar metadata backup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Settings]
      summary: Buat backup manual
      description: |
        Memerlukan permission `settings.manage`. Tanpa request body. Membuat
        berkas SQL terkompresi (gzip) berisi semua tabel milik tenant;
        proses sinkron dan durasinya bergantung pada ukuran data. Percobaan
        yang berhasil maupun gagal tercatat di audit log.
      responses:
        '201':
          description: Metadata backup yang baru dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settings/backups/{id}/download:
    parameters:
      - $ref: '#/components/parameters/BackupId'
    get:
      tags: [Settings]
      summary: Unduh berkas backup
      description: |
        Memerlukan permission `settings.manage`. Mengalirkan berkas gzip
        berisi dump SQL milik tenant.
      responses:
        '200':
          description: |
            Berkas backup (application/gzip) dengan nama file pada header
            `Content-Disposition`.
          headers:
            Content-Disposition:
              schema:
                type: string
              description: attachment; filename*=UTF-8''backup-<tenant>-<waktu>.sql.gz
          content:
            application/gzip:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Backup belum selesai dibuat (BACKUP_NOT_READY).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /audit-logs:
    get:
      tags: [AuditLogs]
      summary: Jejak audit tenant
      description: |
        Memerlukan permission `audit.view` dan hanya tersedia untuk pengguna
        tenant. Audit log bersifat append-only; endpoint ini hanya membaca.
        Filter `action` adalah pencarian sebagian (ILIKE); `module` dan
        `entity_type` mencocokkan persis.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
        - name: user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: module
          in: query
          schema:
            type: string
        - name: action
          in: query
          description: Pencarian sebagian pada kolom action (ILIKE).
          schema:
            type: string
        - name: entity_type
          in: query
          schema:
            type: string
        - name: from
          in: query
          description: Tanggal awal (YYYY-MM-DD, inklusif).
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: Tanggal akhir (YYYY-MM-DD, inklusif).
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Entri audit terpaginasi, terbaru dulu.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'

  /audit-logs/modules:
    get:
      tags: [AuditLogs]
      summary: Daftar modul pada jejak audit
      description: |
        Memerlukan permission `audit.view`. Modul berbeda yang benar-benar
        ada pada jejak audit tenant, untuk mengisi dropdown filter.
      responses:
        '200':
          description: Nama modul terurut alfabetis.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditModuleListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: fixphone_refresh

  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PerPage:
      name: per_page
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    UserId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OrderId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SparepartId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CategoryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SupplierId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InvoiceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpenseId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WarrantyId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ClaimId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    NotificationId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WhatsAppMessageId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TrackingToken:
      name: token
      in: path
      required: true
      description: Token tracking 32 karakter hex.
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{32}$'
    ReportOutletId:
      name: outlet_id
      in: query
      description: |
        UUID outlet target. Bila kosong, laporan memakai outlet aktif dari
        header `X-Outlet-Id` atau outlet pertama yang dapat diakses.
      schema:
        type: string
        format: uuid
    ReportFrom:
      name: from
      in: query
      description: |
        Tanggal awal rentang (YYYY-MM-DD, inklusif) pada timezone outlet.
        Default 30 hari sebelum `to`. Rentang maksimal 370 hari.
      schema:
        type: string
        format: date
    ReportTo:
      name: to
      in: query
      description: Tanggal akhir rentang (YYYY-MM-DD, inklusif). Default hari ini.
      schema:
        type: string
        format: date
    ReportFormat:
      name: format
      in: query
      description: 'Bila `xlsx`, respons adalah file Excel, bukan JSON.'
      schema:
        type: string
        enum: [json, xlsx]
        default: json
    BackupId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: Token tidak ada/tidak valid/kedaluwarsa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: Tidak memiliki permission atau berada di luar scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource tidak ada atau bukan milik tenant.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: Aksi bertentangan dengan aturan bisnis atau duplikat.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Validation:
      description: Validasi field gagal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    RateLimited:
      description: Terlalu banyak request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 150
        password:
          type: string
          minLength: 1
          maxLength: 72

    UpdateProfileRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        phone:
          type: [string, 'null']
          maxLength: 30
        avatar_path:
          type: [string, 'null']
          maxLength: 255
          description: Harus diawali `uploads/` atau `/uploads/`.

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 8
          maxLength: 72

    AuthOutlet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string

    AuthUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
        avatar_path:
          type: [string, 'null']
        role:
          type: string
          enum: [super_admin, owner, admin, technician, cashier]
        tenant_id:
          type: [string, 'null']
          format: uuid
        permissions:
          type: array
          items:
            type: string
        outlets:
          type: array
          items:
            $ref: '#/components/schemas/AuthOutlet'
        active_outlet_id:
          type: [string, 'null']
          format: uuid
        must_change_password:
          type: boolean
        last_login_at:
          type: [string, 'null']
          format: date-time

    Session:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          const: Bearer
        expires_in:
          type: integer
          description: Detik sampai access token kedaluwarsa.
        user:
          $ref: '#/components/schemas/AuthUser'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
        role:
          type: string
        role_name:
          type: string
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        last_login_at:
          type: [string, 'null']
          format: date-time
        outlets:
          type: array
          items:
            $ref: '#/components/schemas/AuthOutlet'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateUserRequest:
      type: object
      required: [name, email, role, password]
      properties:
        name:
          type: string
          maxLength: 120
        email:
          type: string
          format: email
        phone:
          type: [string, 'null']
          maxLength: 30
        role:
          type: string
          enum: [owner, admin, technician, cashier]
        password:
          type: string
          minLength: 8
          maxLength: 72
        outlet_ids:
          type: array
          items:
            type: string
            format: uuid
        is_active:
          type: boolean
          default: true

    UpdateUserRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 120
        phone:
          type: [string, 'null']
          maxLength: 30
        role:
          type: string
          enum: [owner, admin, technician, cashier]
        is_active:
          type: boolean

    ReplaceOutletsRequest:
      type: object
      required: [outlet_ids]
      properties:
        outlet_ids:
          type: array
          items:
            type: string
            format: uuid

    ResetPassword:
      type: object
      properties:
        temporary_password:
          type: string
        must_change_password:
          type: boolean

    Role:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        permissions:
          type: array
          items:
            type: string

    Permission:
      type: object
      properties:
        code:
          type: string
        module:
          type: string
        description:
          type: [string, 'null']

    Outlet:
      type: object
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        address:
          type: [string, 'null']
        phone:
          type: [string, 'null']
        timezone:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOutletRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 20
        name:
          type: string
          maxLength: 120
        address:
          type: [string, 'null']
          maxLength: 500
        phone:
          type: [string, 'null']
          maxLength: 30
        timezone:
          type: string
          maxLength: 50
        is_active:
          type: boolean
          default: true

    UpdateOutletRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 20
        name:
          type: string
          maxLength: 120
        address:
          type: [string, 'null']
          maxLength: 500
        phone:
          type: [string, 'null']
          maxLength: 30
        timezone:
          type: string
          maxLength: 50
        is_active:
          type: boolean

    Meta:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

    ErrorEnvelope:
      type: object
      required: [success, error]
      properties:
        success:
          type: boolean
          const: false
        error:
          $ref: '#/components/schemas/ApiError'
        request_id:
          type: string

    SessionEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Session'

    ProfileEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/AuthUser'

    UserEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/User'

    UserListEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        meta:
          $ref: '#/components/schemas/Meta'

    ResetPasswordEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/ResetPassword'

    RoleListEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Role'

    PermissionListEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Permission'

    OutletListEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Outlet'

    OutletEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          $ref: '#/components/schemas/Outlet'

    MessageEnvelope:
      type: object
      properties:
        success:
          type: boolean
          const: true
        data:
          type: object
          properties:
            message:
              type: string

    DashboardSummary:
      type: object
      properties:
        services_today:
          type: integer
        waiting_count:
          type: integer
        in_progress_count:
          type: integer
        completed_count:
          type: integer
        not_picked_up_count:
          type: integer
        revenue_today:
          type: integer
          description: Rupiah dari pembayaran posted hari ini.
        revenue_month:
          type: integer
          description: Rupiah dari pembayaran posted bulan berjalan.
        total_customers:
          type: integer
          description: Pelanggan tenant yang belum dihapus.
        alerts:
          type: object
          properties:
            overdue:
              type: integer
            not_picked_up_3d:
              type: integer
            low_stock:
              type: integer

    DashboardChartPoint:
      type: object
      properties:
        date:
          type: string
          format: date
        label:
          type: string
          example: 04 Nov
        revenue:
          type: integer
        services_received:
          type: integer
        services_completed:
          type: integer

    DashboardCharts:
      type: object
