          type: [string, 'null']
          maxLength: 50
          description: Zona waktu IANA valid, mis. Asia/Jakarta.
        ticket_prefix:
          type: [string, 'null']
          maxLength: 10
          description: Tidak boleh kosong atau spasi saja.
        ticket_format:
          type: [string, 'null']
          maxLength: 60
        invoice_prefix:
          type: [string, 'null']
          maxLength: 10
          description: Tidak boleh kosong atau spasi saja.
        invoice_format:
          type: [string, 'null']
          maxLength: 60
        invoice_terms:
          type: [string, 'null']
        invoice_footer:
          type: [string, 'null']
        default_service_warranty_days:
          type: [integer, 'null']
          minimum: 0
          maximum: 3650
        default_part_warranty_days:
          type: [integer, 'null']
          minimum: 0
          maximum: 3650
        receipt_paper_width:
          type: [integer, 'null']
          description: Hanya 58 atau 80.
        technician_sees_only_assigned:
          type: [boolean, 'null']
        public_tracking_enabled:
          type: [boolean, 'null']
        wa_provider:
          type: [string, 'null']
          description: noop, fonnte, atau wablas.
        wa_templates:
          oneOf:
            - $ref: '#/components/schemas/WATemplates'
            - type: 'null'
