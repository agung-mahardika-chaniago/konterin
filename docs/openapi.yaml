        '200':
          description: Ringkasan penerimaan dan rekap per metode bayar.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySummaryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'

  /payments/{id}/void:
    post:
