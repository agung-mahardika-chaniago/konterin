    get:
      tags: [Payments]
      summary: Rekap kasir harian
      description: |
        Memerlukan permission `payment.view`. Hanya menghitung pembayaran posted
        pada tanggal tersebut; pembayaran void dilaporkan terpisah.
      parameters:
        - name: date
          in: query
          description: Tanggal laporan (YYYY-MM-DD), default hari ini pada timezone outlet.
