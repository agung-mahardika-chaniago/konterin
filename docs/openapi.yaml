                $ref: '#/components/schemas/TopUsedListEnvelope'

  /invoices:
    get:
      tags: [Invoices]
      summary: Daftar invoice pada outlet aktif
      description: Memerlukan permission `invoice.view`.
      parameters:
        - name: q
          in: query
          description: Cari nomor invoice, tiket, nama, atau telepon pelanggan.
          schema:
            type: string
        - name: status
          in: query
          description: Satu atau beberapa status dipisahkan koma.
          schema:
            type: string
            example: unpaid,partial
        - name: outlet_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Tanggal dibuat (YYYY-MM-DD) pada timezone outlet.
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar invoice terpaginasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'

  /invoices/{id}:
    get:
      tags: [Invoices]
      summary: Detail invoice
      description: Memerlukan permission `invoice.view`.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Detail invoice beserta snapshot item, pembayaran, dan header toko.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Invoices]
      summary: Ubah diskon/catatan invoice draft
      description: |
        Memerlukan permission `invoice.update`. Total selalu dihitung ulang
        server dari item servis. Invoice non-draft atau yang sudah memiliki
        pembayaran ditolak `409 INVOICE_LOCKED`.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateInvoiceRequest'
      responses:
        '200':
          description: Invoice setelah perubahan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'

  /invoices/{id}/issue:
    post:
      tags: [Invoices]
      summary: Finalisasi invoice draft
      description: |
        Memerlukan permission `invoice.create`. Menyalin item servis menjadi
        snapshot `invoice_items`, menerapkan diskon, dan mengubah status menjadi
        `unpaid` (atau `paid` bila total 0). Hanya dapat dilakukan sekali.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Invoice hasil finalisasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /invoices/{id}/void:
    post:
      tags: [Invoices]
      summary: Batalkan invoice tanpa pembayaran
      description: |
        Memerlukan permission `invoice.void`. Ditolak `409 INVOICE_HAS_PAYMENT`
        bila masih ada pembayaran posted; void pembayaran terlebih dahulu.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonRequest'
      responses:
        '200':
          description: Invoice berstatus void.
          content:
