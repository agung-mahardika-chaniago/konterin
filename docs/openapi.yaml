            address:
              type: [string, 'null']
            phone:
              type: [string, 'null']
        public_token:
          type: [string, 'null']
        tracking_url:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ServiceOrderDetailEnvelope:
