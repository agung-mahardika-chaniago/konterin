          headers:
            Content-Disposition:
              description: Hanya ada pada respons xlsx.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BrandsReportEnvelope'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
