      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSparepartRequest'
      responses:
        '201':
          description: Sparepart dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SparepartEnvelope'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'

  /spareparts/barcode/{code}:
    get:
      tags: [Inventory]
