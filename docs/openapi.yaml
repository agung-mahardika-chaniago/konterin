        test_result:
          type: [string, 'null']
        technician_notes:
          type: [string, 'null']
        diagnosed_by_id:
          type: [string, 'null']
          format: uuid
        diagnosed_by:
          type: [string, 'null']
        diagnosed_at:
          type: [string, 'null']
          format: date-time
        estimated_done_at:
          type: [string, 'null']
          format: date-time
        updated_at:
          type: string
          format: date-time

    ServiceOrderItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        item_type:
          type: string
          enum: [service, sparepart, custom]
        sparepart_id:
          type: [string, 'null']
          format: uuid
        description:
          type: string
        qty:
          type: number
        unit_price:
          type: integer
          format: int64
        cost_price:
          type: integer
          format: int64
          description: 0 bila aktor tidak memiliki `inventory.cost.view`.
        discount_amount:
          type: integer
          format: int64
        subtotal:
          type: integer
          format: int64
        warranty_days:
          type: integer
        added_by:
          type: [string, 'null']
        created_at:
          type: string
          format: date-time

    SparepartOption:
