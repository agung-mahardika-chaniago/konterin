          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvoiceDetailEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /invoices/{id}/payments:
    get:
      tags: [Payments]
      summary: Semua pembayaran pada invoice
      description: Memerlukan permission `payment.view`.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200':
          description: Daftar pembayaran posted dan void.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Payments]
      summary: Terima pembayaran penuh atau DP
      description: |
        Memerlukan permission `payment.create`. Nominal tidak boleh melebihi
        sisa tagihan (`409 OVERPAYMENT`). Kirim header `Idempotency-Key` agar
        retry tidak membuat pembayaran ganda.
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
        - name: Idempotency-Key
          in: header
          required: false
          description: Kunci unik per tenant, maksimum 100 karakter.
          schema:
            type: string
            maxLength: 100
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequest'
      responses:
        '201':
          description: Pembayaran tercatat dan status invoice diperbarui.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMutationEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'

  /payments:
    get:
      tags: [Payments]
      summary: Daftar transaksi pembayaran
      description: Memerlukan permission `payment.view`.
      parameters:
        - name: q
          in: query
          description: Cari nomor pembayaran, invoice, tiket, pelanggan, atau referensi.
          schema:
            type: string
        - name: status
          in: query
          description: Satu atau beberapa status dipisahkan koma (`posted`/`void`).
          schema:
            type: string
        - name: method
          in: query
          schema:
            type: string
            enum: [cash, bank_transfer, qris, card, other]
        - name: outlet_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Tanggal bayar (YYYY-MM-DD) pada timezone outlet.
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar pembayaran terpaginasi.
          content:
