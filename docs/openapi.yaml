          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: outlet_id
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          description: Tanggal pengeluaran awal (YYYY-MM-DD).
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar pengeluaran terpaginasi beserta total nominal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'
    post:
      tags: [Expenses]
      summary: Catat pengeluaran baru
      description: Memerlukan permission `expense.create`. Nomor `EXP-YYMMDD-SEQ` dibuat atomik per outlet.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateExpenseRequest'
      responses:
        '201':
          description: Pengeluaran tercatat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'

  /expenses/{id}:
    patch:
      tags: [Expenses]
      summary: Ubah pengeluaran
      description: Memerlukan permission `expense.update`.
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateExpenseRequest'
      responses:
        '200':
          description: Pengeluaran setelah perubahan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
    delete:
      tags: [Expenses]
      summary: Hapus pengeluaran (soft delete)
      description: Memerlukan permission `expense.delete`.
      parameters:
        - $ref: '#/components/parameters/ExpenseId'
      responses:
        '200':
          description: Pengeluaran dihapus.
