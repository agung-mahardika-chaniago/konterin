      responses:
        '200':
          description: Kategori sistem dan kustom beserta jumlah pemakaian.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCategoryListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Expenses]
      summary: Tambah kategori pengeluaran
      description: Memerlukan permission `expense.create`. Nama unik per tenant (case-insensitive).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExpenseCategoryRequest'
      responses:
        '201':
          description: Kategori dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCategoryEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'

  /service-orders/{id}/public-link:
    get:
      tags: [ServiceOrders]
      summary: Ambil link tracking publik
      description: |
        Memerlukan permission `service.view`. Mengembalikan token dan URL
        tracking yang sudah ada; token baru dibuat otomatis bila belum ada
        atau sudah kedaluwarsa. Masa berlaku 30 hari, atau 90 hari setelah
        servis diambil. `tracking_url` kosong bila `APP_BASE_URL` belum diatur.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Link tracking publik aktif.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicLinkEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /public/track:
    get:
      tags: [Tracking]
      summary: Cari status servis secara publik
      description: |
        Tidak memerlukan autentikasi. Rate limit 10 request/menit/IP. Nomor
        tiket dan empat digit terakhir nomor HP wajib cocok. Kegagalan selalu
        memakai pesan generik agar tidak membocorkan keberadaan data.
      security: []
      parameters:
        - name: ticket
          in: query
          required: true
          schema:
            type: string
          example: FP-261103-0001
        - name: phone_last4
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9]{4}$'
          example: '7890'
      responses:
        '200':
          description: Data tracking yang sudah difilter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTrackingEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'

  /public/track/{token}:
    get:
      tags: [Tracking]
      summary: Buka status servis melalui token QR
      description: |
        Tidak memerlukan autentikasi. Rate limit 10 request/menit/IP. Token
        berupa 32 karakter hex dan harus belum kedaluwarsa.
      security: []
      parameters:
        - $ref: '#/components/parameters/TrackingToken'
      responses:
        '200':
          description: Data tracking yang sudah difilter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicTrackingEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'

  /public/store:
    get:
      tags: [Tracking]
      summary: Identitas toko untuk halaman tracking
      description: |
        Tidak memerlukan autentikasi. Rate limit 10 request/menit/IP. Hanya
        tersedia bila token tracking valid dan tracking publik aktif.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F]{32}$'
      responses:
        '200':
          description: Nama dan logo toko.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicStoreEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'
        '429':
          $ref: '#/components/responses/RateLimited'

  /warranties:
    get:
      tags: [Warranties]
      summary: Daftar garansi
      description: |
        Memerlukan permission `warranty.view`. Data dibatasi tenant dan outlet
        yang dapat diakses aktor. Garansi aktif yang sudah melewati tanggal
        akhir otomatis ditandai `expired`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, expired, void]
        - name: q
          in: query
          description: Cari nomor garansi, tiket, nama pelanggan, atau perangkat.
          schema:
            type: string
        - name: outlet_id
          in: query
          schema:
            type: string
            format: uuid
        - name: expiring_in_days
          in: query
          description: Hanya garansi aktif yang berakhir dalam N hari ke depan.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar garansi terpaginasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarrantyListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'

  /warranties/{id}:
    get:
      tags: [Warranties]
      summary: Detail garansi
      description: |
        Memerlukan permission `warranty.view`. Respons memuat invoice terkait
        dan daftar klaim garansi.
      parameters:
        - $ref: '#/components/parameters/WarrantyId'
      responses:
        '200':
          description: Detail garansi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarrantyEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /warranties/{id}/claims:
    post:
      tags: [Warranties]
      summary: Buat klaim garansi
      description: |
        Memerlukan permission `warranty.claim`. Hanya garansi `active` yang
        belum berakhir yang dapat diklaim. Klaim baru berstatus `submitted`,
        memicu notifikasi in-app, dan mengantrikan pesan WhatsApp.
      parameters:
        - $ref: '#/components/parameters/WarrantyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWarrantyClaimRequest'
      responses:
        '201':
          description: Klaim garansi dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarrantyClaimEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'

  /claims:
    get:
      tags: [Warranties]
      summary: Daftar klaim garansi
      description: Memerlukan permission `warranty.view`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [submitted, approved, rejected, in_progress, completed]
        - name: q
          in: query
          description: Cari nomor klaim, nomor garansi, tiket, atau pelanggan.
          schema:
            type: string
        - name: outlet_id
          in: query
          schema:
            type: string
            format: uuid
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar klaim terpaginasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarrantyClaimListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'

  /claims/{id}:
    get:
      tags: [Warranties]
      summary: Detail klaim garansi
      description: Memerlukan permission `warranty.view`.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '200':
          description: Detail klaim.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarrantyClaimEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Warranties]
      summary: Ubah status atau resolusi klaim
      description: |
        Memerlukan permission `warranty.claim`. Transisi yang diizinkan:
        `submitted` -> `approved`/`rejected`/`in_progress`,
        `approved` -> `in_progress`/`completed`/`rejected`,
        `in_progress` -> `completed`/`rejected`. Resolusi wajib diisi saat
        status menjadi `completed` atau `rejected`.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWarrantyClaimRequest'
      responses:
        '200':
          description: Klaim setelah perubahan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarrantyClaimEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Validation'

  /claims/{id}/rework:
    post:
      tags: [Warranties]
      summary: Buat order pengerjaan ulang
      description: |
        Memerlukan permission `service.create` dan `warranty.claim`. Membuat
        service order baru bertipe `rework` tanpa biaya default, menyalin data
        pelanggan/perangkat, dan menautkannya ke klaim. Klaim berubah menjadi
        `in_progress`. Satu klaim hanya boleh memiliki satu order rework.
      parameters:
        - $ref: '#/components/parameters/ClaimId'
      responses:
        '201':
          description: Order rework dibuat.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WarrantyReworkEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /notifications:
    get:
      tags: [Notifications]
      summary: Kotak masuk notifikasi pengguna
      description: |
        Notifikasi personal dan broadcast tenant milik pengguna. Broadcast
        memakai read receipt per pengguna melalui `notification_reads`.
      parameters:
        - name: unread
          in: query
          description: Hanya tampilkan notifikasi yang belum dibaca.
          schema:
            type: boolean
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar notifikasi terpaginasi.
          headers:
            X-Unread-Count:
              description: Jumlah notifikasi belum dibaca milik pengguna.
              schema:
                type: integer
                format: int64
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffNotificationListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notifications/unread-count:
    get:
      tags: [Notifications]
      summary: Jumlah notifikasi belum dibaca
      responses:
        '200':
          description: Jumlah notifikasi belum dibaca.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationUnreadCountEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Tandai satu notifikasi sudah dibaca
      parameters:
        - $ref: '#/components/parameters/NotificationId'
      responses:
        '200':
          description: Notifikasi ditandai sudah dibaca.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Tandai semua notifikasi sudah dibaca
      responses:
        '200':
          description: Semua notifikasi terlihat ditandai sudah dibaca.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationReadAllEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /whatsapp-messages:
    get:
      tags: [Notifications]
      summary: Daftar outbox WhatsApp
      description: Memerlukan permission `settings.manage`.
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [queued, processing, sent, failed, cancelled]
        - name: q
          in: query
          description: Cari nomor HP, nomor tiket, atau nama pelanggan.
          schema:
            type: string
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: Daftar pesan outbox terpaginasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppMessageListEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /whatsapp-messages/{id}/retry:
    post:
      tags: [Notifications]
      summary: Antrikan ulang pesan WhatsApp
      description: |
        Memerlukan permission `settings.manage`. Status menjadi `queued`,
        `attempts` direset, dan pesan dijadwalkan segera. Pesan berstatus
        `sent` tidak dapat dikirim ulang (`409 MESSAGE_SENT`).
      parameters:
        - $ref: '#/components/parameters/WhatsAppMessageId'
      responses:
        '200':
          description: Pesan setelah diantrikan ulang.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WhatsAppMessageEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'

  /service-orders/{id}/notify:
    post:
      tags: [Notifications]
      summary: Antrikan pesan WhatsApp untuk servis
      description: |
        Memerlukan permission `service.update`. Bila `message` kosong, template
        `template_key` dirender dengan data servis. Respons `201` memuat
        `message_id` dan `status` outbox.
      parameters:
        - $ref: '#/components/parameters/OrderId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotifyServiceOrderRequest'
      responses:
        '201':
          description: Pesan masuk ke outbox.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotifyServiceOrderEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Validation'

  /reports/revenue:
    get:
      tags: [Reports]
      summary: Laporan pendapatan
      description: |
        Memerlukan permission `report.view` dan hanya tersedia untuk
        pengguna tenant. Invoice non-draft dan non-void diagregasi per hari,
        bulan, atau tahun sesuai `period`, dipecah menjadi jasa, sparepart,
        diskon, serta bagian lunas/belum lunas.
      parameters:
        - $ref: '#/components/parameters/ReportOutletId'
        - $ref: '#/components/parameters/ReportFrom'
        - $ref: '#/components/parameters/ReportTo'
        - name: period
          in: query
          description: Pengelompokan bucket.
          schema:
            type: string
            enum: [daily, monthly, yearly]
            default: daily
        - $ref: '#/components/parameters/ReportFormat'
      responses:
        '200':
          description: |
            Agregasi pendapatan. Dengan `format=xlsx` respons berupa file
            Excel bernama `laporan-pendapatan-<from>_<to>.xlsx`.
          headers:
            Content-Disposition:
              description: Hanya ada pada respons xlsx.
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RevenueReportEnvelope'
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/Validation'

